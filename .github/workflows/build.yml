name: Universal build
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test the same universal JAR on every target
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          chmod +x gradlew
          xvfb-run -a ./gradlew build testAllClients --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: VTP-universal-and-test-results
          path: |
            build/libs/*.jar
            */build/test-results/
            */build/run/clientGameTest/screenshots/
            */build/run/clientGameTest/logs/
