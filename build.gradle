import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
}
group = project.maven_group
apply from: 'gradle/build-version.gradle'

def targets = [
    mc261: [game: '26.1.2', api: '0.145.4+26.1.2', family: '26.1', minApi: '0.145.1', compat: ['legacy', 'mc261']],
    mc262: [game: '26.2', api: '0.154.2+26.2', family: '26.2', compat: ['legacy', 'mc262']],
    mc263: [game: '26.3', api: '0.160.7+26.3', family: '26.3', compat: ['mc263']],
    test2610: [game: '26.1', api: '0.145.1+26.1', family: '26.1', compat: ['legacy', 'mc261'], testOnly: true],
    test2611: [game: '26.1.1', api: '0.145.4+26.1.1', family: '26.1', compat: ['legacy', 'mc261'], testOnly: true]
]

def implementationProjects = [project(':mc261'), project(':mc262'), project(':mc263')]

subprojects { child ->
    apply plugin: 'net.fabricmc.fabric-loom'
    def target = targets[child.name]
    group = rootProject.group
    version = "${rootProject.version}+mc${target.family}"
    base.archivesName = 'VTP'
    dependencies {
        minecraft "com.mojang:minecraft:${target.game}"
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${target.api}"
        testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach { options.release = 25 }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    sourceSets {
        main {
            java.setSrcDirs([rootProject.file('src/main/java')] + target.compat.collect { rootProject.file("src/compat/${it}/java") })
            resources.setSrcDirs([rootProject.file('src/main/resources')])
        }
        test.java.setSrcDirs([rootProject.file('src/test/java')])
    }
    processResources {
        inputs.property('version', project.version)
        inputs.property('minecraftRange', "~${target.family}")
        inputs.property('fabricApiRange', ">=${target.minApi ?: target.api.substring(0, target.api.indexOf('+'))}")
        filesMatching('fabric.mod.json') { expand(version: project.version, minecraftRange: "~${target.family}", fabricApiRange: ">=${target.minApi ?: target.api.substring(0, target.api.indexOf('+'))}") }
        doLast {
            if (target.family != '26.3') {
                def config = new File(destinationDir, 'villager-trading-predictor.mixins.json')
                def data = new JsonSlurper().parse(config)
                data.client.remove('accessor.SequenceFunctionAccessor')
                config.text = JsonOutput.prettyPrint(JsonOutput.toJson(data)) + System.lineSeparator()
            }
        }
    }
    tasks.named('test') { useJUnitPlatform() }
    fabricApi.configureTests {
        createSourceSet = true
        modId = 'vtp-gametest'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
    sourceSets.gametest {
        java.setSrcDirs([rootProject.file('src/gametest/java')] + target.compat.collect { rootProject.file("src/compat/${it}/gametest/java") })
        resources.setSrcDirs([rootProject.file('src/gametest/resources')])
    }
    tasks.named('processGametestResources') {
        inputs.property 'bundleVersion', rootProject.version
        filesMatching('fabric.mod.json') { expand(bundleVersion: rootProject.version) }
    }
    // Exercise the distributed universal JAR, excluding development implementations from the runtime.
    tasks.named('runClientGameTest') {
        dependsOn rootProject.tasks.named('universalJar')
        classpath = sourceSets.gametest.runtimeClasspath.filter { file ->
            !sourceSets.main.output.files.any { it.canonicalFile == file.canonicalFile }
        }
        systemProperty 'fabric.addMods', rootProject.tasks.named('universalJar').get().archiveFile.get().asFile.absolutePath
    }
}

def metadataDir = layout.buildDirectory.dir('generated/bundle')
tasks.register('generateBundleMetadata') {
    inputs.property 'version', project.version
    outputs.dir metadataDir
    doLast {
        def output = metadataDir.get().asFile
        output.mkdirs()
        def data = [schemaVersion: 1, id: 'villager-trading-predictor-universal', version: project.version.toString(),
            name: 'Villager Trading Predictor Universal', environment: 'client',
            description: 'Villager Trading Predictor for Minecraft 26.1.x, 26.2 and 26.3.',
            license: 'LicenseRef-Proprietary',
            depends: [fabricloader: ">=${project.loader_version}", minecraft: ['~26.1', '~26.2', '~26.3'], java: '>=25',
                      'villager-trading-predictor': "=${project.version}"],
            jars: targets.values().findAll { !it.testOnly }.collect { [file: "META-INF/jars/vtp-${it.family}.jar"] }]
        new File(output, 'fabric.mod.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(data)) + System.lineSeparator()
    }
}
tasks.register('universalJar', Jar) {
    dependsOn 'generateBundleMetadata', implementationProjects.collect { it.tasks.named('jar') }
    archiveBaseName = 'VTP'
    archiveVersion = project.version.toString()
    archiveClassifier = 'mc26-universal'
    destinationDirectory = layout.buildDirectory.dir('libs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(metadataDir)
    from('LICENSE')
    implementationProjects.each { child ->
        from(child.tasks.named('jar').flatMap { it.archiveFile }) {
            into 'META-INF/jars'
            rename { "vtp-${targets[child.name].family}.jar" }
        }
    }
}
tasks.named('assemble') { dependsOn 'universalJar' }
tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
tasks.register('testAllClients') {
    group = 'verification'
    description = 'Run the full client suite against the universal JAR on every supported release line.'
    dependsOn subprojects.collect { it.tasks.named('runClientGameTest') }
}
project(':test2611').tasks.named('runClientGameTest') { mustRunAfter project(':test2610').tasks.named('runClientGameTest') }
project(':mc261').tasks.named('runClientGameTest') { mustRunAfter project(':test2611').tasks.named('runClientGameTest') }
project(':mc262').tasks.named('runClientGameTest') { mustRunAfter project(':mc261').tasks.named('runClientGameTest') }
project(':mc263').tasks.named('runClientGameTest') { mustRunAfter project(':mc262').tasks.named('runClientGameTest') }

// Validate the exact distributable, including each bundled implementation's metadata.
tasks.register('verifyBundle') {
    group = 'verification'
    dependsOn 'universalJar'
    inputs.file tasks.named('universalJar').flatMap { it.archiveFile }
    doLast {
        def file = tasks.named('universalJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(file).withCloseable { outer ->
            def metadata = new JsonSlurper().parse(outer.getInputStream(outer.getEntry('fabric.mod.json')))
            assert metadata.jars.size() == 3
            assert !metadata.entrypoints && !metadata.mixins
            metadata.jars.each { item ->
                assert outer.getEntry(item.file) != null
                def bytes = outer.getInputStream(outer.getEntry(item.file)).bytes
                def contents = [:]
                new java.util.zip.ZipInputStream(new ByteArrayInputStream(bytes)).withCloseable { nested ->
                    for (def entry = nested.nextEntry; entry != null; entry = nested.nextEntry) {
                        if (entry.name == 'fabric.mod.json') contents.metadata = new JsonSlurper().parse(nested.readAllBytes())
                        assert !entry.name.contains('GameTest') : 'Test class in release JAR'
                    }
                }
                assert contents.metadata.id == 'villager-trading-predictor'
                assert contents.metadata.version.startsWith(rootProject.version.toString() + '+mc')
                assert contents.metadata.entrypoints.client.size() == 1
            }
        }
        logger.lifecycle('Verified universal artifact: ' + file)
    }
}
tasks.named('check') { dependsOn 'verifyBundle' }
